<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>雷霆战机 · Thunder Fighter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05060f; overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: #05060f; box-shadow: 0 0 60px rgba(60,140,255,.35); border-radius: 6px; cursor: crosshair; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(4,8,20,.82); backdrop-filter: blur(3px);
    color: #e8f2ff; text-align: center; padding: 24px; z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: clamp(28px, 6vw, 52px); letter-spacing: 6px; font-weight: 800; margin-bottom: 8px;
    background: linear-gradient(90deg, #4fc3ff, #a06bff, #ff5fa2);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .overlay .sub { color: #7f93b5; letter-spacing: 2px; margin-bottom: 28px; font-size: 14px; }
  .overlay .tips { color: #9fb3d1; font-size: 14px; line-height: 2; margin-bottom: 30px; }
  .overlay .tips b { color: #4fc3ff; }
  .btn {
    padding: 14px 46px; font-size: 18px; letter-spacing: 4px; color: #fff; cursor: pointer;
    border: none; border-radius: 40px; font-weight: 700;
    background: linear-gradient(135deg, #2b7bff, #7a3cff);
    box-shadow: 0 8px 28px rgba(70,110,255,.5);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 34px rgba(70,110,255,.7); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .score-big { font-size: 46px; font-weight: 800; color: #ffd54f; margin: 6px 0 4px; }
  .score-label { color: #7f93b5; letter-spacing: 3px; font-size: 13px; }
  .stat-row { display: flex; gap: 40px; margin: 18px 0 30px; }
  .stat-row div { display: flex; flex-direction: column; gap: 4px; }
  .stat-row span:first-child { color: #7f93b5; font-size: 12px; letter-spacing: 2px; }
  .stat-row span:last-child { color: #e8f2ff; font-size: 22px; font-weight: 700; }
  #pauseHint {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    color: #4fc3ff; font-size: 13px; letter-spacing: 2px; opacity: .55; pointer-events: none; z-index: 5;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="pauseHint">空格 / P 暂停</div>

  <div class="overlay" id="startScreen">
    <h1>雷霆战机</h1>
    <div class="sub">THUNDER FIGHTER</div>
    <div class="tips">
      <b>鼠标 / 触摸</b> 移动战机 &nbsp;·&nbsp; <b>自动开火</b><br>
      <b>WASD / 方向键</b> 也可操控 &nbsp;·&nbsp; <b>空格</b> 暂停<br>
      拾取 <b style="color:#4fc3ff">蓝色 P</b> 升级火力 &nbsp;·&nbsp; <b style="color:#5cff9d">绿色 S</b> 获得护盾
    </div>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>

  <div class="overlay hidden" id="overScreen">
    <h1 style="font-size:clamp(24px,5vw,40px)">任务结束</h1>
    <div class="score-label">最终得分</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="stat-row">
      <div><span>击毁敌机</span><span id="finalKills">0</span></div>
      <div><span>存活时间</span><span id="finalTime">0s</span></div>
      <div><span>最高纪录</span><span id="bestScore">0</span></div>
    </div>
    <button class="btn" id="restartBtn">再来一局</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 480, H = 800;

  function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.width = W * s * devicePixelRatio;
    canvas.height = H * s * devicePixelRatio;
    canvas.style.width = (W * s) + 'px';
    canvas.style.height = (H * s) + 'px';
    ctx.setTransform(s * devicePixelRatio, 0, 0, s * devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resize);

  const STATE = { MENU: 0, PLAY: 1, PAUSE: 2, OVER: 3 };
  let state = STATE.MENU;

  let player, bullets, enemyBullets, enemies, particles, powerups, stars;
  let score, kills, elapsed, spawnTimer, spawnInterval, difficulty, bossTimer, bossActive;
  let lastTime = 0;
  let bestScore = +(localStorage.getItem('tf_best') || 0);

  const keys = {};
  const pointer = { x: W / 2, y: H - 120, active: false };

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const dist2 = (a, b) => { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; };

  function initStars() {
    stars = [];
    for (let i = 0; i < 140; i++) {
      stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.4, 1.8), sp: rand(20, 120), a: rand(0.2, 0.9) });
    }
  }

  function resetGame() {
    player = { x: W / 2, y: H - 120, r: 16, speed: 380, hp: 3, maxHp: 3, power: 1, shield: 0, invuln: 0, fireCd: 0, alive: true };
    bullets = []; enemyBullets = []; enemies = []; particles = []; powerups = [];
    score = 0; kills = 0; elapsed = 0;
    spawnTimer = 0; spawnInterval = 0.9; difficulty = 1;
    bossTimer = 0; bossActive = false;
    pointer.x = player.x; pointer.y = player.y;
    initStars();
  }

  function explode(x, y, color, count = 14, speed = 220) {
    for (let i = 0; i < count; i++) {
      const ang = rand(0, Math.PI * 2), sp = rand(speed * 0.2, speed);
      particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: rand(0.3, 0.8), maxLife: 0.8, r: rand(1.5, 4), color });
    }
  }

  function playerShoot() {
    const p = player, lvl = p.power;
    const mk = (dx, dy, ang, dmg = 1) => bullets.push({
      x: p.x + dx, y: p.y + dy, vx: Math.sin(ang) * 780, vy: -Math.cos(ang) * 780, r: 4, dmg, color: '#7fe3ff'
    });
    if (lvl === 1) { mk(0, -18, 0); }
    else if (lvl === 2) { mk(-8, -14, 0); mk(8, -14, 0); }
    else if (lvl === 3) { mk(0, -20, 0); mk(-10, -12, -0.12); mk(10, -12, 0.12); }
    else if (lvl === 4) { mk(-6, -18, 0); mk(6, -18, 0); mk(-14, -10, -0.18); mk(14, -10, 0.18); }
    else { mk(0, -22, 0, 2); mk(-8, -16, -0.1); mk(8, -16, 0.1); mk(-16, -8, -0.24); mk(16, -8, 0.24); }
  }

  function spawnEnemy() {
    const roll = Math.random();
    const x = rand(50, W - 50);
    if (roll < 0.62) {
      const hp = 1 + Math.floor(difficulty * 0.4);
      enemies.push({ type: 'basic', x, y: -40, r: 18, hp, maxHp: hp, vy: rand(90, 140) + difficulty * 8, vx: 0, score: 10, color: '#ff6b6b', fireCd: 0, shoot: false });
    } else if (roll < 0.88) {
      const hp = 4 + Math.floor(difficulty * 1.2);
      enemies.push({ type: 'elite', x, y: -50, r: 24, hp, maxHp: hp, vy: rand(60, 90) + difficulty * 5, vx: 0, score: 30, color: '#ffa94d', fireCd: rand(0.8, 1.6), shoot: true });
    } else {
      const hp = 2 + Math.floor(difficulty * 0.6);
      enemies.push({ type: 'zigzag', x, y: -40, r: 16, hp, maxHp: hp, vy: rand(110, 160) + difficulty * 8, vx: rand(80, 140) * (Math.random() < 0.5 ? -1 : 1), score: 20, color: '#c77dff', fireCd: 0, shoot: false, phase: rand(0, Math.PI * 2) });
    }
  }

  function spawnBoss() {
    bossActive = true;
    const hp = 60 + difficulty * 30;
    enemies.push({ type: 'boss', x: W / 2, y: -120, r: 60, hp, maxHp: hp, vy: 60, vx: 0, score: 300, color: '#ff4d6d', fireCd: 1.2, shoot: true, entering: true, dir: 1 });
  }

  function maybeDropPowerup(x, y) {
    const r = Math.random();
    if (r < 0.10) powerups.push({ x, y, r: 12, vy: 90, type: 'power', t: 0 });
    else if (r < 0.16) powerups.push({ x, y, r: 12, vy: 90, type: 'shield', t: 0 });
  }

  function hitPlayer() {
    const p = player;
    if (p.shield > 0) { p.shield = 0; p.invuln = 1.0; explode(p.x, p.y, '#5cff9d', 20, 260); return; }
    p.hp--; p.invuln = 1.6; p.power = Math.max(1, p.power - 1);
    explode(p.x, p.y, '#ff6b6b', 24, 300);
    if (p.hp <= 0) { p.alive = false; explode(p.x, p.y, '#ffd43b', 50, 420); setTimeout(gameOver, 700); }
  }

  function update(dt) {
    elapsed += dt;
    difficulty = 1 + elapsed / 25;
    spawnInterval = Math.max(0.28, 0.9 - elapsed * 0.012);

    for (const s of stars) { s.y += s.sp * dt; if (s.y > H) { s.y = -2; s.x = rand(0, W); } }

    const p = player;
    if (p.alive) {
      let dx = 0, dy = 0;
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) dx -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
      if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= 1;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += 1;
      if (dx || dy) {
        const len = Math.hypot(dx, dy) || 1;
        p.x += (dx / len) * p.speed * dt; p.y += (dy / len) * p.speed * dt;
        pointer.x = p.x; pointer.y = p.y;
      } else if (pointer.active) {
        p.x += (pointer.x - p.x) * Math.min(1, dt * 18);
        p.y += (pointer.y - p.y) * Math.min(1, dt * 18);
      }
      p.x = clamp(p.x, p.r, W - p.r);
      p.y = clamp(p.y, p.r + 40, H - p.r);
      p.fireCd -= dt;
      if (p.fireCd <= 0) { playerShoot(); p.fireCd = 0.13; }
      if (p.invuln > 0) p.invuln -= dt;
      if (p.shield > 0) p.shield -= dt;
    }

    if (!bossActive) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = spawnInterval * rand(0.7, 1.3); }
      bossTimer += dt;
      if (bossTimer > 32) { bossTimer = 0; spawnBoss(); }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.type === 'boss') {
        if (e.entering) {
          e.y += e.vy * dt;
          if (e.y >= 130) { e.y = 130; e.entering = false; }
        } else {
          e.x += e.dir * 90 * dt;
          if (e.x > W - e.r - 20) { e.x = W - e.r - 20; e.dir = -1; }
          if (e.x < e.r + 20) { e.x = e.r + 20; e.dir = 1; }
          e.y = 130 + Math.sin(elapsed * 1.5) * 20;
          e.fireCd -= dt;
          if (e.fireCd <= 0) {
            e.fireCd = Math.max(0.5, 1.1 - difficulty * 0.05);
            const n = 5;
            for (let k = 0; k < n; k++) {
              const ang = Math.PI / 2 + (k - (n - 1) / 2) * 0.28;
              enemyBullets.push({ x: e.x, y: e.y + e.r * 0.6, vx: Math.cos(ang) * 220, vy: Math.sin(ang) * 220, r: 6, color: '#ff5fa2' });
            }
          }
        }
      } else {
        e.y += e.vy * dt;
        if (e.type === 'zigzag') { e.phase += dt * 3; e.x += Math.sin(e.phase) * e.vx * dt; e.x = clamp(e.x, e.r, W - e.r); }
        if (e.shoot) {
          e.fireCd -= dt;
          if (e.fireCd <= 0 && e.y > 0 && e.y < H * 0.7) {
            e.fireCd = rand(1.0, 2.0);
            const ang = Math.atan2(player.y - e.y, player.x - e.x);
            enemyBullets.push({ x: e.x, y: e.y + e.r, vx: Math.cos(ang) * 260, vy: Math.sin(ang) * 260, r: 5, color: '#ffd43b' });
          }
        }
        if (e.y > H + 60) { enemies.splice(i, 1); continue; }
      }

      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        const rr = e.r + b.r;
        if (dist2(e, b) < rr * rr) {
          e.hp -= b.dmg; bullets.splice(j, 1);
          explode(b.x, b.y, '#9fe8ff', 4, 120);
          if (e.hp <= 0) {
            explode(e.x, e.y, e.color, e.type === 'boss' ? 60 : 16, e.type === 'boss' ? 380 : 240);
            score += e.score; kills++;
            if (e.type === 'boss') {
              bossActive = false; bossTimer = 0;
              powerups.push({ x: e.x - 20, y: e.y, r: 12, vy: 90, type: 'power', t: 0 });
              powerups.push({ x: e.x + 20, y: e.y, r: 12, vy: 90, type: 'shield', t: 0 });
            } else { maybeDropPowerup(e.x, e.y); }
            enemies.splice(i, 1);
            break;
          }
        }
      }
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) { enemyBullets.splice(i, 1); continue; }
      if (player.alive && player.invuln <= 0) {
        const rr = player.r + b.r;
        if (dist2(player, b) < rr * rr) { enemyBullets.splice(i, 1); hitPlayer(); }
      }
    }

    if (player.alive && player.invuln <= 0) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const rr = player.r + e.r * 0.8;
        if (dist2(player, e) < rr * rr) {
          if (e.type !== 'boss') { explode(e.x, e.y, e.color, 16, 240); enemies.splice(i, 1); }
          hitPlayer();
          break;
        }
      }
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
      const pu = powerups[i];
      pu.y += pu.vy * dt; pu.t += dt;
      if (pu.y > H + 20) { powerups.splice(i, 1); continue; }
      if (player.alive) {
        const rr = player.r + pu.r + 6;
        if (dist2(player, pu) < rr * rr) {
          if (pu.type === 'power') { player.power = Math.min(5, player.power + 1); score += 5; }
          else { player.shield = Math.min(8, player.shield + 5); }
          explode(pu.x, pu.y, pu.type === 'power' ? '#4fc3ff' : '#5cff9d', 12, 180);
          powerups.splice(i, 1);
        }
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.96; pt.vy *= 0.96; pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
  }

  function drawShip(x, y, r, invuln) {
    ctx.save();
    ctx.translate(x, y);
    if (invuln > 0 && Math.floor(invuln * 12) % 2 === 0) ctx.globalAlpha = 0.35;
    const flame = 10 + Math.sin(elapsed * 40) * 4;
    const g = ctx.createLinearGradient(0, r * 0.6, 0, r * 0.6 + flame);
    g.addColorStop(0, 'rgba(120,220,255,.95)');
    g.addColorStop(1, 'rgba(60,120,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(-6, r * 0.6); ctx.lineTo(6, r * 0.6); ctx.lineTo(0, r * 0.6 + flame); ctx.closePath(); ctx.fill();

    ctx.beginPath();
    ctx.moveTo(0, -r); ctx.lineTo(r * 0.62, r * 0.35); ctx.lineTo(r * 0.28, r * 0.6);
    ctx.lineTo(-r * 0.28, r * 0.6); ctx.lineTo(-r * 0.62, r * 0.35); ctx.closePath();
    const bg = ctx.createLinearGradient(0, -r, 0, r);
    bg.addColorStop(0, '#dff4ff'); bg.addColorStop(0.5, '#4fc3ff'); bg.addColorStop(1, '#1a5fd0');
    ctx.fillStyle = bg; ctx.shadowColor = '#4fc3ff'; ctx.shadowBlur = 14; ctx.fill(); ctx.shadowBlur = 0;

    ctx.beginPath(); ctx.ellipse(0, -r * 0.15, r * 0.22, r * 0.4, 0, 0, Math.PI * 2); ctx.fillStyle = '#0b2a4a'; ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -r * 0.25, r * 0.12, r * 0.22, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(180,240,255,.9)'; ctx.fill();
    ctx.restore();
  }

  function drawEnemy(e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    if (e.type === 'boss') {
      ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 24;
      ctx.beginPath();
      ctx.moveTo(0, e.r * 0.9); ctx.lineTo(e.r, 0); ctx.lineTo(e.r * 0.6, -e.r * 0.7);
      ctx.lineTo(-e.r * 0.6, -e.r * 0.7); ctx.lineTo(-e.r, 0); ctx.closePath();
      const bg = ctx.createLinearGradient(0, -e.r, 0, e.r);
      bg.addColorStop(0, '#ff8fa3'); bg.addColorStop(1, '#8b0f2a');
      ctx.fillStyle = bg; ctx.fill(); ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(0, 0, e.r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = '#ffe066'; ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 20; ctx.fill(); ctx.shadowBlur = 0;
    } else {
      ctx.rotate(Math.PI);
      ctx.beginPath();
      ctx.moveTo(0, -e.r); ctx.lineTo(e.r * 0.8, e.r * 0.6); ctx.lineTo(0, e.r * 0.3); ctx.lineTo(-e.r * 0.8, e.r * 0.6); ctx.closePath();
      ctx.fillStyle = e.color; ctx.shadowColor = e.color; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(0, -e.r * 0.1, e.r * 0.22, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
    }
    ctx.restore();

    if (e.maxHp > 2) {
      const w = e.type === 'boss' ? 120 : 40, h = e.type === 'boss' ? 8 : 4;
      const bx = e.x - w / 2, by = e.y - e.r - 14;
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(bx, by, w, h);
      ctx.fillStyle = e.type === 'boss' ? '#ff4d6d' : '#ffa94d';
      ctx.fillRect(bx, by, w * (e.hp / e.maxHp), h);
    }
  }

  function draw() {
    ctx.fillStyle = '#05060f'; ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.globalAlpha = s.a; ctx.fillStyle = '#cfe6ff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const pu of powerups) {
      const pulse = 1 + Math.sin(pu.t * 8) * 0.15;
      ctx.save(); ctx.translate(pu.x, pu.y); ctx.scale(pulse, pulse);
      ctx.beginPath(); ctx.arc(0, 0, pu.r, 0, Math.PI * 2);
      const col = pu.type === 'power' ? '#4fc3ff' : '#5cff9d';
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#04121f'; ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(pu.type === 'power' ? 'P' : 'S', 0, 1);
      ctx.restore();
    }

    for (const e of enemies) drawEnemy(e);

    for (const b of bullets) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0;
    }
    for (const b of enemyBullets) {
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.color; ctx.shadowColor = b.color; ctx.shadowBlur = 14; ctx.fill(); ctx.shadowBlur = 0;
    }

    if (player.alive) {
      if (player.shield > 0) {
        ctx.beginPath(); ctx.arc(player.x, player.y, player.r + 10, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(92,255,157,' + (0.5 + Math.sin(elapsed * 10) * 0.3) + ')';
        ctx.lineWidth = 2.5; ctx.shadowColor = '#5cff9d'; ctx.shadowBlur = 16; ctx.stroke(); ctx.shadowBlur = 0;
      }
      drawShip(player.x, player.y, player.r, player.invuln);
    }

    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fillStyle = pt.color; ctx.fill();
    }
    ctx.globalAlpha = 1;

    // HUD
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillStyle = '#e8f2ff';
    ctx.fillText('分数 ' + score, 16, 14);

    ctx.textAlign = 'right';
    for (let i = 0; i < player.maxHp; i++) {
      const hx = W - 20 - i * 26, hy = 24;
      ctx.beginPath();
      ctx.moveTo(hx, hy + 6); ctx.lineTo(hx + 8, hy - 6); ctx.lineTo(hx + 16, hy + 6);
      ctx.lineTo(hx + 8, hy + 14); ctx.closePath();
      ctx.fillStyle = i < player.hp ? '#ff5fa2' : 'rgba(255,95,162,.2)';
      ctx.fill();
    }

    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = 'bold 13px "Segoe UI", sans-serif';
    ctx.fillStyle = '#4fc3ff';
    ctx.fillText('火力 Lv.' + player.power, 16, 42);
    if (player.shield > 0) {
      ctx.fillStyle = '#5cff9d';
      ctx.fillText('护盾 ' + player.shield.toFixed(1) + 's', 16, 62);
    }

    if (state === STATE.PAUSE) {
      ctx.fillStyle = 'rgba(4,8,20,.7)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e8f2ff'; ctx.font = 'bold 34px "Segoe UI", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('已暂停', W / 2, H / 2 - 10);
      ctx.font = '15px "Segoe UI", sans-serif'; ctx.fillStyle = '#7f93b5';
      ctx.fillText('按 空格 / P 继续', W / 2, H / 2 + 34);
    }
  }

  function loop(t) {
    if (!lastTime) lastTime = t;
    let dt = (t - lastTime) / 1000;
    lastTime = t;
    dt = Math.min(dt, 0.05);
    if (state === STATE.PLAY) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');

  function startGame() {
    resetGame();
    state = STATE.PLAY;
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    lastTime = 0;
  }

  function gameOver() {
    state = STATE.OVER;
    if (score > bestScore) { bestScore = score; localStorage.setItem('tf_best', bestScore); }
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalKills').textContent = kills;
    document.getElementById('finalTime').textContent = Math.floor(elapsed) + 's';
    document.getElementById('bestScore').textContent = bestScore;
    overScreen.classList.remove('hidden');
  }

  function togglePause() {
    if (state === STATE.PLAY) state = STATE.PAUSE;
    else if (state === STATE.PAUSE) { state = STATE.PLAY; lastTime = 0; }
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      if (state === STATE.PLAY || state === STATE.PAUSE) togglePause();
      else if (state === STATE.MENU || state === STATE.OVER) startGame();
    }
  });
  window.addEventListener('keyup', (e) => { keys[e.key] = false; });

  function toGameCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) / rect.width * W,
      y: (clientY - rect.top) / rect.height * H
    };
  }

  canvas.addEventListener('mousemove', (e) => {
    const p = toGameCoords(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  });
  canvas.addEventListener('mouseleave', () => { pointer.active = false; });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const p = toGameCoords(t.clientX, t.clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    const p = toGameCoords(t.clientX, t.clientY);
    pointer.x = p.x; pointer.y = p.y; pointer.active = true;
  }, { passive: false });

  canvas.addEventListener('touchend', () => { pointer.active = false; });

  resize();
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
