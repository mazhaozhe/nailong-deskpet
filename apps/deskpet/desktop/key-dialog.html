<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>配置 DeepSeek API Key</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px 20px 16px;
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: #ffffff; color: #1c1f23;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1e2024; color: #e8eaed; }
    input { background: #26292e !important; color: #e8eaed !important; border-color: #3a3f46 !important; }
    .hint { color: #9aa0a6 !important; }
    button.secondary { background: #2b2f35 !important; color: #e8eaed !important; border-color: #3a3f46 !important; }
  }
  h1 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .hint { margin: 0 0 12px; font-size: 12px; color: #5f6368; }
  label { display: block; font-size: 12px; margin-bottom: 6px; color: inherit; }
  input {
    width: 100%; height: 34px; padding: 0 10px;
    border: 1px solid #d0d4d9; border-radius: 6px; font-size: 13px;
    font-family: Consolas, "Cascadia Mono", monospace; outline: none;
  }
  input:focus { border-color: #4c8bf5; box-shadow: 0 0 0 3px rgba(76,139,245,.18); }
  .error { min-height: 18px; margin: 8px 0 0; font-size: 12px; color: #d93025; }
  .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  button {
    height: 32px; padding: 0 16px; border-radius: 6px; font-size: 13px;
    border: 1px solid transparent; cursor: pointer;
  }
  button.primary { background: #4c8bf5; color: #fff; }
  button.primary:hover { background: #3d7ae0; }
  button.secondary { background: #f1f3f4; color: #1c1f23; border-color: #d0d4d9; }
  button:disabled { opacity: .6; cursor: default; }
  .foot { margin-top: 10px; font-size: 11px; color: #80868b; }
</style>
</head>
<body>
  <h1>配置 DeepSeek API Key</h1>
  <p class="hint">Key 只由桌面主进程接收，用系统加密后存在本机；页面和日志都不会出现明文。</p>
  <label for="key">API Key</label>
  <input id="key" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false" autofocus>
  <div class="error" id="error"></div>
  <div class="row">
    <button class="secondary" id="cancel">取消</button>
    <button class="primary" id="save">保存</button>
  </div>
  <div class="foot">保存后会重启本地服务并立即生效；随时可在设置里删除。</div>
<script>
  const input = document.getElementById('key');
  const errorBox = document.getElementById('error');
  const save = document.getElementById('save');
  const cancel = document.getElementById('cancel');

  function fail(message) {
    errorBox.textContent = message;
    input.focus();
  }

  function submit() {
    const raw = input.value.trim().replace(/^Bearer\s+/i, '');
    if (!raw) return fail('请粘贴 Key，或点「取消」。');
    if (/\s/.test(raw)) return fail('Key 里不能有空格或换行，请检查是否复制完整。');
    if (!/^sk-[A-Za-z0-9_-]{10,}$/.test(raw)) {
      return fail('格式不对：DeepSeek Key 以 sk- 开头，后面是字母数字。');
    }
    errorBox.textContent = '';
    save.disabled = true;
    save.textContent = '保存中…';
    window.keyDialog.submit(raw);
  }

  save.addEventListener('click', submit);
  cancel.addEventListener('click', () => window.keyDialog.cancel());
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') { event.preventDefault(); submit(); }
    if (event.key === 'Escape') { event.preventDefault(); window.keyDialog.cancel(); }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') window.keyDialog.cancel();
  });
  input.focus();
</script>
</body>
</html>
